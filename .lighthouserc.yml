ci:
  collect:
    numberOfRuns: 1
    startServerCommand: npx serve content/public --listen 3000 --no-clipboard
    startServerReadyPattern: Accepting connections
    startServerReadyTimeout: 15000
    url:
      - http://localhost:3000/
      - http://localhost:3000/tracks/
  assert:
    preset: lighthouse:no-pwa
    assertions:
      categories:performance:
        - warn
        - minScore: 0.8
      categories:accessibility:
        - warn
        - minScore: 0.9
      categories:best-practices:
        - warn
        - minScore: 0.85
      categories:seo:
        - warn
        - minScore: 0.85
      # Downgraded to warn: dominated by third-party assets (Leaflet CDN JS,
      # Carto map tiles) and map markers that this site cannot control.
      unused-css-rules: warn
      unused-javascript: warn
      uses-responsive-images: warn
      image-delivery-insight: warn
      modern-image-formats: warn
      target-size: warn
      cls-culprits-insight: warn
      forced-reflow-insight: warn
  upload:
    target: temporary-public-storage
