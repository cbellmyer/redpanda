name: Lighthouse CI

on:
  pull_request:
    paths:
      - "content/**"
      - ".hugo-version"
      - ".lighthouserc.yml"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache Hugo resources
        uses: actions/cache@v5
        with:
          path: content/resources/_gen
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('content/**', 'content/assets/**', 'content/hugo.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Install content dependencies
        run: cd content && npm install

      - name: Build Hugo site
        run: cd content && npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli serve

      - name: Run Lighthouse CI
        run: lhci autorun --config=.lighthouserc.yml
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
