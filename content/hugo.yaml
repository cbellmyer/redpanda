# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://redpanda.pet"
title: Rory
copyright: "CC BY-NC 4.0"
theme: [hypercat-theme]

enableInlineShortcodes: true
buildDrafts: false
buildFuture: true
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

disableKinds:
  - taxonomy
  - term

menu:
  main:
    - name: Shutterpaws
      url: https://shutterpaws.pics/
      weight: 15
    - name: Tracks
      url: /tracks/
      weight: 30
    # - name: Search
    #   url: search/
    #   weight: 10
    # - name: Tags
    #   url: tags/
    #   weight: 10
    # - name: Photography
    #   url: https://photo.redpanda.pet/

outputs:
  home:
    - HTML
    - JSON
  page:
    - HTML
  section:
    - HTML

params:
  env: production
  description: "Rory"
  author: Rory
  # author: ["Me", "You"] # multiple authors

  # disableSpecial1stPost: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # images: ["images/hyper.png"]

  profileMode:
    enabled: true
    title: Rory
    subtitle: "[ {{< myAge >}} | Furtographer | Nerd | Red Panda | Gamer ]"
    imageUrl: "images/profile/rory.png"
    imageTitle: Rory
    imageWidth: 400
    imageHeight: 509
    buttons:
      - name: Photography
        url: https://photo.redpanda.pet/
      - name: Furtrack
        url: https://www.furtrack.com/user/furcologist/

  socialIcons:
    - name: telegram
      title: Talk to me on Telegram
      url: "https://t.me/furcologist"
    - name: bluesky
      title: Follow on Bluesky
      url: "https://bsky.app/profile/redpanda.pet"
    - name: kofi
      title: Support on Ko-Fi
      url: "https://ko-fi.com/furcologist"
    - name: twitter
      title: Follow on twitter
      url: "https://twitter.com/furcologist"
    - name: facebook
      title: Follow on Facebook
      url: "https://www.facebook.com/chris.bellmyer"
    - name: lastfm
      title: Check out what I'm listening to on Last.fm
      url: "https://www.last.fm/user/furcologist"
    - name: steam
      title: Follow on Steam
      url: "https://steamcommunity.com/id/furcologist"
    - name: github
      title: Follow on GitHub
      url: "https://github.com/cbellmyer"
    - name: discord
      title: Join on Discord
      url: "https://discord.com/users/104330735866884096"

  # label:
  # iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" height="25"
  #   viewBox="0 -960 960 960" fill="currentColor"><path
  #   d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33
  #   0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5
